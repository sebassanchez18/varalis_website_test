<section [id]="content.id" class="bg-brand-muted" [attr.aria-labelledby]="content.titleId">
  <div
    class="mx-auto grid max-w-page items-stretch gap-stack px-gutter py-gutter sm:px-gutter-sm lg:grid-cols-2 lg:items-center lg:gap-layout lg:py-0 lg:pr-0 lg:pl-layout"
  >
    <div class="flex flex-col items-start gap-stack py-section-sm lg:py-process-y">
      <p class="font-sans text-eyebrow font-normal text-ink-muted">{{ content.eyebrow }}</p>
      <h2
        [id]="content.titleId"
        class="font-sans text-privacy-sm font-semibold text-ink lg:text-privacy"
      >
        {{ content.title }}
      </h2>
      <p class="font-sans text-pillar-body text-ink-muted lg:text-pillar">
        {{ content.description }}
      </p>
      <app-button variant="strong" [href]="content.ctaHref">{{ content.ctaLabel }}</app-button>
    </div>

    <div class="relative min-h-process overflow-hidden rounded-card lg:h-full">
      <img
        [ngSrc]="content.imageSrc"
        fill
        [alt]="content.imageAlt"
        class="object-cover"
        sizes="(min-width: 1024px) 50vw, 100vw"
      />
    </div>
  </div>
</section>
